# Tool versions — weekly check of the quality tools pinned in scripts/install-tools
# (gitleaks, actionlint, hadolint, osv-scanner). Dependabot can't see those pins, so
# this opens (or refreshes) one tracking issue when a newer release exists. Bump the
# version in install-tools on a branch; the issue is closed by hand after the merge.
name: Tool versions

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # open/update the tracking issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Pinned quality tools are outdated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exit 1 = outdated (open an issue); exit 2 = couldn't check (fail the job).
      - name: Compare pinned versions with latest releases
        id: check
        run: |
          set +e
          ./scripts/check-tool-versions | tee report.txt
          status=${PIPESTATUS[0]}
          [ "$status" -eq 2 ] && exit 1
          echo "outdated=$([ "$status" -eq 1 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      - name: Open or update the tracking issue
        if: steps.check.outputs.outdated == 'true'
        run: |
          {
            echo "A newer release exists for a tool pinned in \`scripts/install-tools\`."
            echo "Bump the version there on a branch, run \`./scripts/install-tools\` and"
            echo "\`./scripts/verify\`, then ship it. Close this issue after the merge."
            echo
            echo '```text'
            cat report.txt
            echo '```'
          } >body.md
          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
