# CI — the independent quality gate. It runs the SAME entry point as local work
# (`scripts/verify`), so green local == green CI. Stage commands live in
# `scripts/verify`, never here. See the `setup-ci` skill and ADR-001/ADR-002.
#
# The job name `verify` is the required status check in the branch ruleset
# (`templates/github/branch-ruleset.json`) — keep it stable.
#
# No `paths-ignore` on purpose: a required check that never runs leaves docs-only
# PRs stuck at "Expected". `scripts/verify` itself skips test/integration when only
# non-essential files changed (NON_ESSENTIAL, ADR-003), so the check still reports.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest   # has Docker + Compose for the integration stage
    timeout-minutes: 20
    env:
      # Set the repo variable VERIFY_STRICT=1 once stages are configured, so an
      # unconfigured stage fails instead of silently passing.
      VERIFY_STRICT: ${{ vars.VERIFY_STRICT || '0' }}
    steps:
      # Actions are pinned by commit SHA (a tag can be moved to other code; a SHA
      # can't). Dependabot bumps the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # full history, so gitleaks scans every commit of the PR
          persist-credentials: false   # don't leave the token in .git/config for build scripts

      # Stack-agnostic checks used by `template_lint` (gitleaks, actionlint,
      # hadolint) at the versions pinned in scripts/install-tools.
      - name: Install quality tools
        run: |
          ./scripts/install-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Runtime setup for your stack (uncomment one). Install deps here or inside
      # the stage commands in scripts/verify — but not in both places.
      # - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      #   with: { node-version-file: '.nvmrc', cache: 'npm' }
      # - run: npm ci
      # - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      #   with: { python-version: '3.12', cache: 'pip' }
      # - run: pip install -r requirements.txt
      # - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      #   with: { go-version-file: 'go.mod' }

      - name: Verify (lint, test, integration)
        env:
          # What the change is compared against, to detect docs-only changes. An
          # unresolvable base (e.g. first push of a branch) runs every stage.
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify full
