# CI — the independent quality gate. It runs the SAME entry point as local work
# (`scripts/verify`), so green local == green CI. Stage commands live in
# `scripts/verify`, never here. See the `setup-ci` skill and ADR-001/ADR-002.
#
# The job name `verify` is the required status check in the branch ruleset
# (`templates/github/branch-ruleset.json`) — keep it stable.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest   # has Docker + Compose for the integration stage
    timeout-minutes: 20
    env:
      # Set the repo variable VERIFY_STRICT=1 once stages are configured, so an
      # unconfigured stage fails instead of silently passing.
      VERIFY_STRICT: '1'   # test project: fully configured
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so gitleaks scans every commit of the PR

      # Stack-agnostic checks used by `template_lint` (gitleaks, actionlint,
      # hadolint) at the versions pinned in scripts/install-tools.
      - name: Install quality tools
        run: |
          ./scripts/install-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Runtime setup for your stack (uncomment one). Install deps here or inside
      # the stage commands in scripts/verify — but not in both places.
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc' }
      # - uses: actions/setup-python@v6
      #   with: { python-version: '3.12', cache: 'pip' }
      # - run: pip install -r requirements.txt
      # - uses: actions/setup-go@v6
      #   with: { go-version-file: 'go.mod' }

      - name: Verify (lint, test, integration)
        run: ./scripts/verify full
